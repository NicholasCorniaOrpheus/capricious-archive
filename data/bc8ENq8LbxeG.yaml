content:
  markdown_content: According to the title of [I tre giardini de' madrigali del Costante, Academico Cospirante, Maurizio Moro](https://nicholascorniaorpheus.github.io/accademia-degli-incompresi/entity/GpCVYdi8S5s2), Moro was active in a Venetian academy linked with conspiracy. Unfortunately, I could not find any reference to an _Accademia dei Cospiratori_ or similar organization founded between the 16th and 17th century.

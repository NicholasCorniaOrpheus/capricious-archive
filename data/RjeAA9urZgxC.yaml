content:
  markdown_content: "[Maffeo Venier](https://nicholascorniaorpheus.github.io/accademia-degli-incompresi/entity/bPgtLmWqiDsj) described his fellow academician [Veronica Franco](https://nicholascorniaorpheus.github.io/accademia-degli-incompresi/entity/RjeAA9urZgxC) as \"Donna reduta mostro in carne humana\" [(Campbell 2018)](https://nicholascorniaorpheus.github.io/accademia-degli-incompresi/entity/87RhmBz8z8dT). He compares her to a monster, transgressing the social norms of the time by being a learned courtesan."

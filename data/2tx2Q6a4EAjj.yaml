content:
  markdown_content: According to [(Treadwell 2013)](https://nicholascorniaorpheus.github.io/accademia-degli-incompresi/entity/ikGeNUD5JHua), the Armani led several costume theatrical performances at the court of [Margherita Gonzaga](https://nicholascorniaorpheus.github.io/accademia-degli-incompresi/entity/DKPpSEmDwRA2) taking the role of a female [knight](https://nicholascorniaorpheus.github.io/accademia-degli-incompresi/entity/KH2RsQHZMHpE), imitating the heroines of [Ludovico Ariosto](https://nicholascorniaorpheus.github.io/accademia-degli-incompresi/entity/3tBDveUQba76)'s [Orlando furioso](https://nicholascorniaorpheus.github.io/accademia-degli-incompresi/entity/GdXWhx79h26y) such as [Bradamante](https://nicholascorniaorpheus.github.io/accademia-degli-incompresi/entity/3azdbWZGxLUz).

content:
  markdown_content: As purely speculative statement, we can image that this madrigal could refer to the singing skills of [Tarquinia Molza](https://nicholascorniaorpheus.github.io/accademia-degli-incompresi/entity/4fam9RTzpsG4), related to [Giaches de Wert](https://nicholascorniaorpheus.github.io/accademia-degli-incompresi/entity/P8BCR9vyKpTL) by a strong feeling of affection.
